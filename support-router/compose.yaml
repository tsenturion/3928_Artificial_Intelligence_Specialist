# Compose описывает запуск: образ, опубликованный порт и постоянные данные.
# Имя проекта определяет также имя volume. Сохраняйте его при переходе
# между локальной сборкой и compose.release.yaml, если нужны прежние журналы.
services:
  app:
    # Имя образа пригодится для последующего выпуска версий через CI/CD.
    image: support-router:${SUPPORT_ROUTER_IMAGE_TAG:-local}
    # Точка — контекст сборки с Dockerfile; состав отправляемых файлов ограничен
    # .dockerignore. Готовые model.joblib и metrics.json должны существовать заранее.
    build: .
    ports:
      # Слева адрес/порт компьютера, справа порт процесса внутри контейнера.
      # Порт 8080 не конфликтует с локальным запуском второго этапа на 8000.
      - "127.0.0.1:${SUPPORT_ROUTER_PORT:-8080}:8000"
    volumes:
      # Журналы переживают замену контейнера; приложение ограничивает хранение 30 днями.
      - app_logs:/app/logs

volumes:
  # Именной том управляется Docker и не входит в файловую систему образа.
  # Пересоздание app его сохраняет; команды запуска не используют down -v.
  app_logs:
