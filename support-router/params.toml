# Пути считаются от папки этого файла, поэтому запуск не зависит от текущей папки.
[data]
# Путь к исходному CSV; сам файл приезжает из DVC-хранилища.
source = "data/raw/tickets.csv"
# Читаемая версия дополняет снимок содержимого, который DVC связывает с Git.
version = "1.0.0-synthetic"

[model]
# Читаемая версия модели отличается от версии кода в Git и ID конкретного
# обучения created_at. Эти сведения вместе позволяют понять происхождение ответа.
version = "0.1.0"
# Фиксируем настройку для повторяемых экспериментов; также важны данные,
# параметры остальных шагов и версии библиотек из pyproject.toml.
random_state = 42
# Символьные фрагменты внутри слов помогают работать с окончаниями и опечатками.
ngram_min = 3
ngram_max = 5
# C управляет силой регуляризации: большее значение ослабляет её.
C = 4.0
max_iter = 1000

[evaluation]
# Выпуск требует и этого минимума, и преимущества над DummyClassifier.
# Проверка выполняется после оценки и повторяется при verify в контейнере.
# Порог задан заранее; контрольные примеры не используются для подбора параметров.
min_macro_f1 = 0.75
